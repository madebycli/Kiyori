name: Debug APKs

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Debug variants to build
        required: true
        default: all
        type: choice
        options:
          - all
          - foss
          - gms

permissions:
  contents: read

concurrency:
  group: debug-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Install Android SDK components
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          case "${{ inputs.variant }}" in
            all)
              tasks=(":app:assembleFossDebug" ":app:assembleGmsDebug" ":wearos:assembleDebug")
              ;;
            foss)
              tasks=(":app:assembleFossDebug")
              ;;
            gms)
              tasks=(":app:assembleGmsDebug")
              ;;
            *)
              echo "Unsupported variant: ${{ inputs.variant }}" >&2
              exit 2
              ;;
          esac
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk wearos/build/outputs/apk \
            -type f -name '*-debug.apk' -exec cp '{}' dist/ \; 2>/dev/null || true
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-apks-${{ github.run_number }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
