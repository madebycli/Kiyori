name: Build Kiyori main from verified transfer

on:
  push:
    branches:
      - transfer/kiyori-main-payload
    paths:
      - .github/workflows/kiyori-transfer-diagnostics.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify transfer package
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/kiyori-transfer"
          mkdir -p "$work/payload"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$work/Kiyori-main-transfer.zip" \
            "https://github.com/user-attachments/files/30677354/Kiyori-main-transfer.zip"

          echo "fb9f9acc2eef7b62492200007b47ee1c873008f7798dc7e8caa7822d81d26742  $work/Kiyori-main-transfer.zip" | sha256sum --check --strict
          unzip -q "$work/Kiyori-main-transfer.zip" -d "$work"
          echo "de76366fd3890c8aa92512ec44590ecdebb5d790c54eabad8bc23f954b7a385f  $work/Kiyori-main-transfer.tar.gz" | sha256sum --check --strict
          tar -xzf "$work/Kiyori-main-transfer.tar.gz" -C "$work/payload"

          test -f "$work/payload/stage1/AGENTS.md"
          test -f "$work/payload/stage2/NEXT_CHAT_START.md"
          test -f "$work/payload/stage3/PACKAGING_MANIFEST.json"

      - name: Rebuild main on current develop
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/kiyori-transfer/payload"

          git fetch origin develop
          develop_sha="$(git rev-parse origin/develop)"
          git checkout -B main origin/develop
          git config user.name "Kiyori Recovery"
          git config user.email "recovery@local.invalid"

          rsync -a --exclude='.github/workflows/build-upload-android.yml' "$work/stage1/" ./
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-upload-android.yml')
          text = path.read_text()
          needle = '            "build-tools;${ANDROID_BUILD_TOOLS}"'
          replacement = needle + ' \\\n            --channel=3'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 sdkmanager build-tools lines, found {count}')
          path.write_text(text.replace(needle, replacement))
          PY
          git add -A
          git commit -m "chore: bootstrap Kiyori recovery context"

          rsync -a "$work/stage2/" ./
          git add -A
          git commit -m "docs: complete Kiyori AI handoff and evidence"

          rsync -a "$work/stage3/" ./
          git add -A
          git commit -m "docs: finalize Kiyori transfer package"

          git merge-base --is-ancestor "$develop_sha" HEAD
          test "$(git rev-list --count "$develop_sha"..HEAD)" = "3"
          test "$(git rev-parse HEAD^)" != "$develop_sha"
          test "$(git rev-parse HEAD^^^)" = "$develop_sha"

          git push origin HEAD:refs/heads/main

          {
            echo "DEVELOP_SHA=$develop_sha"
            echo "MAIN_SHA=$(git rev-parse HEAD)"
            echo "COMMITS_FROM_DEVELOP=$(git rev-list --count "$develop_sha"..HEAD)"
            git log --oneline --decorate -4
          } | tee "${RUNNER_TEMP}/kiyori-main-result.txt"

      - name: Set main as default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          if gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f default_branch=main; then
            echo "Default branch changed to main"
          else
            echo "Default branch API change was not permitted for GITHUB_TOKEN"
          fi

      - name: Remove temporary transfer branch
        if: ${{ success() }}
        shell: bash
        run: |
          git push origin --delete transfer/kiyori-main-payload || true
