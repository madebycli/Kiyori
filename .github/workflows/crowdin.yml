name: Crowdin Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: navori-crowdin-sync
  cancel-in-progress: false

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Crowdin configuration
        shell: bash
        env:
          GH_TOKEN_VALUE: ${{ secrets.GH_TOKEN }}
          CROWDIN_PROJECT_ID_VALUE: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN_VALUE: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${GH_TOKEN_VALUE:-}" ]] || missing+=(GH_TOKEN)
          [[ -n "${CROWDIN_PROJECT_ID_VALUE:-}" ]] || missing+=(CROWDIN_PROJECT_ID)
          [[ -n "${CROWDIN_PERSONAL_TOKEN_VALUE:-}" ]] || missing+=(CROWDIN_PERSONAL_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Crowdin is not configured for this fork. Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'New Crowdin Translations'
          pull_request_body: 'New Crowdin translations by [Crowdin GH Action](https://github.com/crowdin/github-action)'
          pull_request_base_branch_name: 'navori/develop'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
