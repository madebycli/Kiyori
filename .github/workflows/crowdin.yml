name: Crowdin Sync

on:
  push:
    branches:
      - main
    paths:
      - core/resources/src/main/res/values/strings.xml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  synchronize-with-crowdin:
    if: github.repository == 'madebycli/Kiyori'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main

      - name: Validate Crowdin secrets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CROWDIN_PROJECT_ID" || { echo "Missing secret CROWDIN_PROJECT_ID" >&2; exit 11; }
          test -n "$CROWDIN_PERSONAL_TOKEN" || { echo "Missing secret CROWDIN_PERSONAL_TOKEN" >&2; exit 12; }

      - name: Synchronize translations
        uses: crowdin/github-action@v2.16.2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: New Crowdin translations
          pull_request_body: New Crowdin translations generated by the Crowdin GitHub Action.
          pull_request_base_branch_name: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
