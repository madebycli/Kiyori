name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Run validation matrix
        shell: bash
        run: ./docs/ai-context/scripts/full_validation_matrix.sh

      - name: Upload reports and APKs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ github.run_number }}
          path: |
            **/build/reports/**
            app/build/outputs/apk/**
            wearos/build/outputs/apk/**
          if-no-files-found: ignore
          retention-days: 7
