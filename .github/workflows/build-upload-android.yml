name: Android Build Release FOSS APK

on:
  push:
    branches:
      - main
    paths:
      - version.properties
  workflow_dispatch:
    inputs:
      single_apk:
        description: Build only the universal APK
        type: boolean
        default: true

permissions:
  contents: read

env:
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode keystore
        uses: timheuer/base64-to-file@v2
        id: android_keystore
        with:
          fileName: android_keystore.keystore
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      - name: Enable universal APK only
        if: ${{ inputs.single_apk == true || env.BRANCH_NAME == 'main' }}
        run: sed -i -e '/isEnable/s/true/false/' app/build.gradle.kts

      - name: Build signed FOSS release
        run: bundle exec fastlane release
        env:
          KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: foss-release-${{ github.run_number }}
          path: ${{ github.workspace }}/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
